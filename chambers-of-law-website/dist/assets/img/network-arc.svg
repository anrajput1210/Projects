<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Abstract illustration: an arc connecting two office locations across a stylised globe">
  <defs>
    <linearGradient id="naGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4922A"/>
      <stop offset="50%" stop-color="#F7C46C"/>
      <stop offset="100%" stop-color="#D4922A"/>
    </linearGradient>
    <style>
      .na-dash { stroke-dasharray: 7 11; animation: naFlow 3.2s linear infinite; }
      .na-ping { transform-origin: center; animation: naPing 3s ease-out infinite; }
      .na-ping2 { animation-delay: 1.5s; }
      .na-globe { transform-origin: 360px 200px; animation: naSpin 60s linear infinite; }
      @keyframes naFlow { to { stroke-dashoffset: -36; } }
      @keyframes naPing { 0% { r: 8; opacity: .7; } 70%,100% { r: 26; opacity: 0; } }
      @keyframes naSpin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .na-dash, .na-ping, .na-globe { animation: none; } }
    </style>
  </defs>

  <g class="na-globe" opacity=".33">
    <circle cx="360" cy="200" r="140" fill="none" stroke="#F2A93B" stroke-width="1.1"/>
    <ellipse cx="360" cy="200" rx="140" ry="52" fill="none" stroke="#F2A93B" stroke-width="1"/>
    <ellipse cx="360" cy="200" rx="140" ry="104" fill="none" stroke="#F2A93B" stroke-width="1" stroke-opacity=".7"/>
    <ellipse cx="360" cy="200" rx="52" ry="140" fill="none" stroke="#F2A93B" stroke-width="1" stroke-opacity=".7"/>
    <ellipse cx="360" cy="200" rx="104" ry="140" fill="none" stroke="#F2A93B" stroke-width="1" stroke-opacity=".5"/>
    <path d="M220 200h280" stroke="#F2A93B" stroke-width="1"/>
  </g>

  <!-- flight arc -->
  <path d="M168 236 Q 360 34 552 176" fill="none" stroke="url(#naGold)" stroke-width="2.6" stroke-linecap="round" class="na-dash"/>

  <!-- Manchester node -->
  <g>
    <circle cx="168" cy="236" r="8" fill="none" stroke="#F7C46C" stroke-width="2" class="na-ping"/>
    <circle cx="168" cy="236" r="7.5" fill="#F2A93B"/>
    <circle cx="168" cy="236" r="14" fill="none" stroke="#F2A93B" stroke-opacity=".45" stroke-width="1.4"/>
    <text x="168" y="278" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#F5F6F8">Manchester</text>
    <text x="168" y="296" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="1.6" fill="#9CA3AF">UNITED KINGDOM</text>
  </g>

  <!-- Ludhiana node -->
  <g>
    <circle cx="552" cy="176" r="8" fill="none" stroke="#F7C46C" stroke-width="2" class="na-ping na-ping2"/>
    <circle cx="552" cy="176" r="7.5" fill="#F2A93B"/>
    <circle cx="552" cy="176" r="14" fill="none" stroke="#F2A93B" stroke-opacity=".45" stroke-width="1.4"/>
    <text x="552" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#F5F6F8">Ludhiana</text>
    <text x="552" y="236" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="1.6" fill="#9CA3AF">INDIA</text>
  </g>

  <circle cx="92" cy="86" r="2.4" fill="#F7C46C" opacity=".55"/>
  <circle cx="644" cy="300" r="2" fill="#F7C46C" opacity=".45"/>
  <circle cx="628" cy="76" r="1.8" fill="#F7C46C" opacity=".4"/>
</svg>
