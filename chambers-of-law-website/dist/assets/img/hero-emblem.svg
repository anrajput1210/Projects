<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-label="Abstract emblem: scales of justice within orbiting rings">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7C46C"/>
      <stop offset="55%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#D4922A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B3852"/>
      <stop offset="100%" stop-color="#1B2331"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2A93B" stop-opacity=".28"/>
      <stop offset="70%" stop-color="#F2A93B" stop-opacity="0"/>
    </radialGradient>
    <style>
      .spin-slow { transform-origin: 220px 220px; animation: spin 46s linear infinite; }
      .spin-rev  { transform-origin: 220px 220px; animation: spin 34s linear infinite reverse; }
      .float-a   { animation: floatA 7s ease-in-out infinite; }
      .float-b   { animation: floatB 9s ease-in-out infinite; }
      .pulse     { transform-origin: 220px 220px; animation: pulse 5s ease-in-out infinite; }
      .twinkle   { animation: twinkle 3.4s ease-in-out infinite; }
      .twinkle-2 { animation: twinkle 4.2s ease-in-out infinite .9s; }
      .twinkle-3 { animation: twinkle 3.8s ease-in-out infinite 1.7s; }
      @keyframes spin   { to { transform: rotate(360deg); } }
      @keyframes floatA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes floatB { 0%,100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
      @keyframes pulse  { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: .9; transform: scale(1.04); } }
      @keyframes twinkle{ 0%,100% { opacity: .25; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .spin-slow, .spin-rev, .float-a, .float-b, .pulse, .twinkle, .twinkle-2, .twinkle-3 { animation: none; }
      }
    </style>
  </defs>

  <circle cx="220" cy="220" r="200" fill="url(#glow)" class="pulse"/>

  <!-- orbiting rings -->
  <g class="spin-slow" opacity=".55">
    <circle cx="220" cy="220" r="168" fill="none" stroke="#F2A93B" stroke-width="1" stroke-opacity=".35" stroke-dasharray="3 10"/>
    <circle cx="220" cy="52"  r="5" fill="#F2A93B"/>
    <circle cx="388" cy="220" r="3" fill="#F7C46C" opacity=".8"/>
  </g>
  <g class="spin-rev" opacity=".5">
    <circle cx="220" cy="220" r="134" fill="none" stroke="#F2A93B" stroke-width="1" stroke-opacity=".28" stroke-dasharray="1 9"/>
    <circle cx="86" cy="220" r="4" fill="#F2A93B" opacity=".85"/>
  </g>
  <circle cx="220" cy="220" r="102" fill="none" stroke="#F2A93B" stroke-width="1.2" stroke-opacity=".22"/>

  <!-- floating document cards -->
  <g class="float-a">
    <rect x="52" y="132" width="78" height="96" rx="10" fill="url(#cardGrad)" stroke="#F2A93B" stroke-opacity=".3"/>
    <rect x="66" y="152" width="42" height="4.5" rx="2.25" fill="#F2A93B" opacity=".75"/>
    <rect x="66" y="166" width="50" height="3.5" rx="1.75" fill="#9CA3AF" opacity=".45"/>
    <rect x="66" y="177" width="50" height="3.5" rx="1.75" fill="#9CA3AF" opacity=".45"/>
    <rect x="66" y="188" width="34" height="3.5" rx="1.75" fill="#9CA3AF" opacity=".45"/>
    <circle cx="76" cy="209" r="7" fill="none" stroke="#F2A93B" stroke-opacity=".7" stroke-width="1.4"/>
    <path d="m72.6 209 2.4 2.4 4.6-4.8" fill="none" stroke="#F2A93B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="float-b">
    <rect x="310" y="216" width="78" height="96" rx="10" fill="url(#cardGrad)" stroke="#F2A93B" stroke-opacity=".3"/>
    <rect x="324" y="236" width="36" height="4.5" rx="2.25" fill="#F2A93B" opacity=".75"/>
    <rect x="324" y="250" width="50" height="3.5" rx="1.75" fill="#9CA3AF" opacity=".45"/>
    <rect x="324" y="261" width="44" height="3.5" rx="1.75" fill="#9CA3AF" opacity=".45"/>
    <path d="M330 286h22M330 294h30" stroke="#9CA3AF" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- central scales of justice -->
  <g stroke="url(#goldGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M220 148v148M180 296h80"/>
    <path d="M156 190h128"/>
    <path d="M156 190l-24 47a26 26 0 0 0 48 0l-24-47ZM284 190l-24 47a26 26 0 0 0 48 0l-24-47Z"/>
  </g>
  <circle cx="220" cy="154" r="9" fill="url(#goldGrad)"/>
  <circle cx="220" cy="190" r="4.5" fill="#F7C46C"/>

  <!-- sparkles -->
  <g fill="#F7C46C">
    <circle cx="128" cy="96"  r="2.6" class="twinkle"/>
    <circle cx="342" cy="128" r="2"   class="twinkle-2"/>
    <circle cx="102" cy="318" r="2.3" class="twinkle-3"/>
    <circle cx="356" cy="352" r="1.8" class="twinkle"/>
    <circle cx="196" cy="66"  r="1.6" class="twinkle-2"/>
  </g>
</svg>
