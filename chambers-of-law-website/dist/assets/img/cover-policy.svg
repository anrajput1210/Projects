<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Abstract illustration: a molecule and shield in balance, representing pharmaceutical patent policy">
  <defs>
    <linearGradient id="poBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232D40"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="poGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7C46C"/>
      <stop offset="100%" stop-color="#D4922A"/>
    </linearGradient>
    <style>
      .po-tilt { transform-origin: 320px 120px; animation: poTilt 8s ease-in-out infinite; }
      .po-node { animation: poPulse 4.5s ease-in-out infinite; }
      .po-n2 { animation-delay: .8s; } .po-n3 { animation-delay: 1.6s; } .po-n4 { animation-delay: 2.4s; }
      @keyframes poTilt { 0%,100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }
      @keyframes poPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .po-tilt, .po-node { animation: none; } }
    </style>
  </defs>
  <rect width="640" height="400" fill="url(#poBg)"/>
  <g stroke="#F2A93B" stroke-opacity=".07" stroke-width="1">
    <path d="M0 100h640M0 200h640M0 300h640M160 0v400M320 0v400M480 0v400"/>
  </g>

  <!-- balance beam with molecule and shield -->
  <g class="po-tilt">
    <path d="M150 120h340" stroke="url(#poGold)" stroke-width="4" stroke-linecap="round"/>
    <path d="M150 120v26M490 120v26" stroke="#F2A93B" stroke-opacity=".55" stroke-width="2"/>

    <!-- left pan: molecule -->
    <g transform="translate(150 200)">
      <path d="M-46 -54 A 58 58 0 0 0 46 -54" fill="none" stroke="#F2A93B" stroke-opacity=".45" stroke-width="2"/>
      <circle cx="0" cy="0" r="15" fill="#33415E" stroke="#F7C46C" stroke-width="2" class="po-node"/>
      <circle cx="-34" cy="26" r="11" fill="#2B3852" stroke="#F2A93B" stroke-width="1.8" class="po-node po-n2"/>
      <circle cx="34" cy="26" r="11" fill="#2B3852" stroke="#F2A93B" stroke-width="1.8" class="po-node po-n3"/>
      <circle cx="0" cy="46" r="9" fill="#2B3852" stroke="#F2A93B" stroke-width="1.8" class="po-node po-n4"/>
      <path d="M-9 11 -26 20M9 11 26 20M-24 34 -6 42M24 34 6 42" stroke="#F2A93B" stroke-opacity=".6" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- right pan: shield -->
    <g transform="translate(490 200)">
      <path d="M-46 -54 A 58 58 0 0 0 46 -54" fill="none" stroke="#F2A93B" stroke-opacity=".45" stroke-width="2"/>
      <path d="M0 -6 36 8v22c0 21-15 34-36 41-21-7-36-20-36-41V8L0-6Z" fill="#2B3852" stroke="url(#poGold)" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="m-13 26 9 9 19-20" fill="none" stroke="#F7C46C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- fulcrum -->
  <path d="M320 120v150M282 300h76" stroke="url(#poGold)" stroke-width="4" stroke-linecap="round"/>
  <path d="M320 300 288 340h64L320 300Z" fill="#2B3852" stroke="#F2A93B" stroke-opacity=".5" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="320" cy="120" r="8" fill="url(#poGold)"/>
</svg>
