<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Abstract illustration: a registered trademark symbol among product shapes">
  <defs>
    <linearGradient id="tmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232D40"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="tmGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7C46C"/>
      <stop offset="100%" stop-color="#D4922A"/>
    </linearGradient>
    <style>
      .tm-ring { transform-origin: 320px 200px; animation: tmSpin 40s linear infinite; }
      .tm-bar  { animation: tmRise 6s ease-in-out infinite; }
      .tm-bar2 { animation: tmRise 6s ease-in-out infinite 1.4s; }
      @keyframes tmSpin { to { transform: rotate(360deg); } }
      @keyframes tmRise { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .tm-ring, .tm-bar, .tm-bar2 { animation: none; } }
    </style>
  </defs>
  <rect width="640" height="400" fill="url(#tmBg)"/>
  <g stroke="#F2A93B" stroke-opacity=".07" stroke-width="1">
    <path d="M0 100h640M0 200h640M0 300h640M160 0v400M320 0v400M480 0v400"/>
  </g>

  <g class="tm-ring" opacity=".4">
    <circle cx="320" cy="200" r="132" fill="none" stroke="#F2A93B" stroke-opacity=".4" stroke-width="1.2" stroke-dasharray="4 12"/>
  </g>

  <!-- four-segment bar motif (shape mark) -->
  <g class="tm-bar">
    <rect x="120" y="150" width="34" height="100" rx="6" fill="#2B3852" stroke="#F2A93B" stroke-opacity=".35"/>
    <rect x="160" y="150" width="34" height="100" rx="6" fill="#2B3852" stroke="#F2A93B" stroke-opacity=".35"/>
  </g>
  <g class="tm-bar2">
    <rect x="446" y="150" width="34" height="100" rx="6" fill="#2B3852" stroke="#F2A93B" stroke-opacity=".35"/>
    <rect x="486" y="150" width="34" height="100" rx="6" fill="#2B3852" stroke="#F2A93B" stroke-opacity=".35"/>
  </g>

  <!-- central R in circle -->
  <circle cx="320" cy="200" r="72" fill="#151C29" stroke="url(#tmGold)" stroke-width="3"/>
  <text x="320" y="228" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="url(#tmGold)">R</text>

  <circle cx="96" cy="86" r="3" fill="#F7C46C" opacity=".7"/>
  <circle cx="548" cy="318" r="2.4" fill="#F7C46C" opacity=".6"/>
  <circle cx="560" cy="82" r="2" fill="#F7C46C" opacity=".5"/>
</svg>
